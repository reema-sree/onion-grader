version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrigrade-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DATABASE_URL=sqlite:///./storage/onion_grading.db
      - SECRET_KEY=agrigrade-super-secure-production-key-2026-sih
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - CORS_ORIGINS=["*"]
      - STORAGE_DIR=/app/storage
      - PUBLIC_BASE_URL=http://localhost:8000
      - MOCK_MODEL=true
      - SMS_MOCK=true
    volumes:
      - agrigrade-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agrigrade-storage:
    driver: local
